<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Planificación Alevín A</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Plan Alevín">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/plancal-touch-180.png">
<link rel="icon" href="icons/plancal-192.png">
<style>
:root{
  --ink:#111214; --red:#c8102e; --red-d:#9d0c24; --paper:#f4f4f2; --card:#fff;
  --line:#dcdcd8; --mute:#6b6d70; --ok:#1e7a3c; --ok-bg:#e3f3e8; --warn:#a86a00; --warn-bg:#fdf1d6;
  --bad:#b3122b; --bad-bg:#fbe3e7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:#fff;padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--ink);box-shadow:0 3px 0 var(--red)}
header img{height:44px;width:auto;flex:none}
.h-t{flex:1;min-width:0}
.h-t b{display:block;font-size:19px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-t span{display:block;font-size:11px;font-weight:800;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;border:0;background:var(--ink);color:#fff;border-radius:8px;height:36px;padding:0 12px;font-weight:800;font-size:13px}

main{flex:1;padding:14px 12px calc(84px + var(--sab))}

/* pestañas del partido */
.seg{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px}
.seg button.on{background:var(--red)}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding-bottom:var(--sab)}
nav div{max-width:820px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:#a9abae;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:15px 4px 14px;border-top:3px solid transparent}
nav button.on{color:#fff;border-top-color:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;padding-left:9px;border-left:5px solid var(--red);line-height:1.2}
.sub{color:var(--mute);font-size:13px}

/* formulario */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .w2{grid-column:1/-1}
label.f{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
label.f input,label.f select,textarea,.inp{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);min-height:42px}
textarea{resize:vertical;font-weight:500;line-height:1.4}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.lv{display:flex;gap:6px;margin-top:4px}
.lv button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;min-height:42px;font-weight:800;font-size:13px;letter-spacing:.04em}
.lv button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:12px 16px;font-size:14px;letter-spacing:.03em}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

.dot{flex:none;width:11px;height:11px;border-radius:50%;background:#b9bbbd}
.dot.ok{background:var(--ok)} .dot.pend{background:#d99a00} .dot.bad{background:var(--bad)}
.login{max-width:420px;margin:28px auto 0}
.login label.f{margin-bottom:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;font-weight:700;font-size:14px;margin-bottom:12px}
/* lista de partidos */
.m{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.m .d{flex:none;width:52px;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:6px 0;line-height:1.1}
.m .d b{display:block;font-size:19px;font-weight:900}
.m .d i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.m .t{flex:1;min-width:0}
.m .t b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t span{display:block;font-size:12.5px;color:var(--mute)}
.pill{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}

/* convocatoria */
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.num{flex:none;width:34px;text-align:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.pl .n{flex:1;min-width:0;font-weight:700}
.pl .n input{margin-top:5px;font-size:14px;min-height:36px;padding:6px 9px;font-weight:500}
.chk{flex:none;width:46px;height:38px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:17px;color:#fff}
.chk.on{background:var(--ink)}
.pl.off .n>span,.pl.off .num{color:var(--mute)}
.count{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.count b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}

/* sextos */
.estado{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-weight:700;border:1px solid}
.estado.ok{background:var(--ok-bg);color:var(--ok);border-color:#b9dfc5}
.estado.warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d79a}
.estado.bad{background:var(--bad-bg);color:var(--bad);border-color:#f1b9c2}
.estado b{display:block;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.estado ul{margin:6px 0 0;padding-left:18px;font-weight:600;font-size:13.5px}
.sx-wrap{overflow-x:auto}
table.sx{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
.sx col.cw{width:29%}
.card.flush{margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0;padding:8px 6px 12px}
.card.flush .hint{padding:0 6px}
.sx th{background:var(--ink);color:#fff;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:7px 2px;text-align:center}
.sx th.r{background:var(--red)}
.sx th.g{background:#3a3c40}
.sx th:first-child{border-radius:8px 0 0 0;text-align:left;padding-left:8px}
.sx th:last-child{border-radius:0 8px 0 0}
.sx td{border-bottom:1px solid var(--line);padding:3px 2px;text-align:center;background:#fff}
.sx tr:nth-child(even) td{background:#f1f1ef}
.sx td.who{text-align:left;padding:4px 4px 4px 2px}
.sx td.who div{display:flex;align-items:center;gap:6px}
.sx td.who b{flex:none;width:26px;text-align:center;font-weight:900;font-size:15px}
.sx td.who span{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx tr.out td.who span{text-decoration:line-through;color:var(--mute)}
.cell{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;color:#fff;padding:0}
.cell.on{background:var(--ink);border-color:var(--ink)}
.cell.six.on{background:#3a3c40;border-color:#3a3c40}
.tot{display:block;border-radius:7px;padding:8px 0;font-weight:900;font-size:15px}
.tot.ok{background:var(--ok-bg);color:var(--ok)}
.tot.warn{background:var(--warn-bg);color:var(--warn)}
.tot.bad{background:var(--bad-bg);color:var(--bad)}
.fal{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;padding:0}
.fal.f4{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fal.f5{background:var(--bad);border-color:var(--bad);color:#fff}
.sx tfoot td{background:#fff!important;border-bottom:0;padding-top:7px;font-weight:900;font-size:13px}
.sx tfoot td.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-left:8px}
.cnt{display:block;border-radius:999px;padding:3px 0}
.cnt.ok{background:var(--ok-bg);color:var(--ok)} .cnt.warn{background:var(--warn-bg);color:var(--warn)} .cnt.bad{background:var(--bad-bg);color:var(--bad)}
.hint{font-size:12.5px;color:var(--mute);margin-top:10px}

.cell.must{border:2px dashed var(--red);color:var(--red);background:#fff6f7}
.cell.no{background:repeating-linear-gradient(135deg,#e6e6e3 0 4px,#f3f3f1 4px 8px);border-color:#d2d3d1}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:10px;padding:0 6px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1.5px solid #b9bbbd;font-style:normal}
.leg i.must{border:2px dashed var(--red)} .leg i.no{background:repeating-linear-gradient(135deg,#e6e6e3 0 4px,#f3f3f1 4px 8px)} .leg i.on{background:var(--ink);border-color:var(--ink)}
/* directo */
.sxsel{display:flex;gap:6px;margin-bottom:12px}
.sxsel button{flex:1;border:1.5px solid var(--ink);background:#fff;border-radius:8px;height:44px;font-weight:900;font-size:16px}
.sxsel button.on{background:var(--ink);color:#fff}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score .tm{font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .n{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score .sep{font-size:30px;font-weight:900;color:var(--mute)}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.pts button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;height:44px;font-weight:900;font-size:15px;padding:0}
.pts button.m{border-color:var(--line);color:var(--mute)}
.parc{font-size:12.5px;color:var(--mute);text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
.lp{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.lp:first-of-type{border-top:0}
.lp .n{flex:1;min-width:0;font-weight:700;line-height:1.2}
.lp .n small{display:block;font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.lp .n small.must{color:var(--red)} .lp .n small.no{color:var(--mute)}
.lp.out .n{text-decoration:line-through;color:var(--mute)}
.fb{flex:none;display:flex;align-items:center;gap:4px}
.fb button{width:40px;height:40px;border-radius:8px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:17px;padding:0}
.fb b{min-width:34px;height:40px;line-height:40px;text-align:center;border-radius:8px;background:#f1f1ef;font-size:17px;font-variant-numeric:tabular-nums}
.fb b.f4{background:var(--warn-bg);color:var(--warn)} .fb b.f5{background:var(--bad);color:#fff}
.sw{flex:none;border:0;border-radius:8px;height:40px;padding:0 12px;font-weight:800;font-size:13px;background:var(--ink);color:#fff}
.sw.in{background:var(--red)}
.h2r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.h2r h2{margin:0}
/* temporada */
.tp tr.pr{cursor:pointer}
.tp .nm{display:block;font-weight:700;line-height:1.2}
.tp .bar{display:block;height:5px;border-radius:3px;background:#e4e4e1;margin-top:5px;overflow:hidden}
.tp .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.tp td.lo{color:var(--warn);font-weight:900} .tp td.up{color:var(--ok);font-weight:900}
.tp td small{display:block;font-size:10.5px;font-weight:800;color:var(--bad);letter-spacing:.02em}
.kp.k4{grid-template-columns:repeat(2,1fr)}
.dist{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:4px}
.dist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.dist i{display:block;width:100%;background:var(--ink);border-radius:5px 5px 0 0;min-height:2px}
.dist i.l{background:#3a3c40}
.dist b{font-size:13px;font-weight:900;margin-bottom:3px}
.dist span{font-size:11px;font-weight:800;color:var(--mute);margin-top:4px}
.hm{padding:9px 0;border-top:1px solid var(--line)}
.hm:first-of-type{border-top:0}
.hm .t{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.hm .t span{font-weight:700;color:var(--mute);font-size:12.5px;flex:none}
.hm .d{font-size:13.5px;margin-top:2px}
.hm.no .t b,.hm.no .d{color:var(--mute)}
.si{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-top:1px}
.si b{color:var(--bad);font-weight:900}
table.tp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tp th{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 4px;text-align:center;border-bottom:2px solid var(--ink)}
.tp th:first-child,.tp td:first-child{text-align:left}
.tp td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-weight:700}
.tp td:first-child{font-weight:700}
.tp td b{display:inline-block;width:28px;font-weight:900}
.tp td.hi{color:var(--bad);font-weight:900}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.kp span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.estado.off{background:#ececea;color:#44464a;border-color:#d6d6d3}
/* objetivos */
.ev{display:flex;gap:6px}
.ev button{width:38px;height:38px;border-radius:50%;border:2.5px solid;background:#fff;font-size:10px;font-weight:900;padding:0}
.ev .s{border-color:var(--ok);color:var(--ok)} .ev .p{border-color:#d99a00;color:#a86a00} .ev .n{border-color:var(--bad);color:var(--bad)}
.ev .s.on{background:var(--ok);color:#fff} .ev .p.on{background:#d99a00;color:#fff} .ev .n.on{background:var(--bad);color:#fff}
.ob{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.ob .hd{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;font-weight:900;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.ob .hd .ev button{width:32px;height:32px;background:transparent}
.ob .hd .ev .s.on{background:var(--ok)} .ob .hd .ev .p.on{background:#d99a00} .ob .hd .ev .n.on{background:var(--bad)}
.ob textarea{border:0;border-radius:0;margin:0}
.ind{padding:9px 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0}
.ind .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ind .top span{flex:1;min-width:0;font-weight:700}

/* normativa */
.rule{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule b{flex:none;width:74px;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--red);padding-top:2px}
.rule p{margin:0;font-size:14px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stp:first-of-type{border-top:0}
.stp span{font-weight:600;font-size:14px}
.stp div{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:18px}
.stp b{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(74px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.cell,.fal{height:42px}.sx col.cw{width:34%}.sx td.who span{font-size:15px}.card.flush{margin-left:0;margin-right:0;border-radius:12px;border:1px solid var(--line);padding:10px 12px}}
@media (prefers-reduced-motion:no-preference){.cell,.chk,.ev button{transition:background .12s}}

.app{max-width:1180px}nav div{max-width:1180px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.cardh h2{margin:0;flex:1}
.lv button.on.bad{background:var(--bad);border-color:var(--bad)}
.hero{display:block;width:100%;text-align:left;border:0;border-radius:14px;background:var(--ink);color:#fff;padding:16px;margin-bottom:12px;box-shadow:inset 0 -5px 0 var(--red)}
.hero span{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#ff9fb0}
.hero b{display:block;font-size:24px;font-weight:900;margin:2px 0}
.hero i{font-style:normal;font-size:13px;color:#c9cbce;font-weight:700}
.card.mini{font-size:14px}
.obj{margin:0;font-size:16px;font-weight:700;line-height:1.35}
.term{padding:7px 0;border-top:1px solid var(--line)}.term:first-of-type{border-top:0}
.term b{display:block;font-weight:900}.term span{display:block;font-size:13px;color:var(--mute)}
.asis{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.ap{display:flex;align-items:center;gap:6px;border:1.5px solid #b9bbbd;background:#fff;border-radius:9px;min-height:44px;padding:4px 8px;text-align:left}
.ap b{font-weight:900;font-size:15px;min-width:20px;text-align:center}.ap span{font-size:13px;font-weight:700;line-height:1.1;overflow:hidden}
.ap.on{background:var(--ink);border-color:var(--ink);color:#fff}
.blk-t{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin:12px 0 4px}
.blk-t:first-child{margin-top:2px}
.ck{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 2px}
.ck i{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--ink);margin-top:1px;position:relative}
.ck.on i{background:var(--ink)}.ck.on i:after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck span{flex:1;font-weight:600;font-size:14.5px;line-height:1.3}
.ck small,.it small{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
.wbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.wbar div{flex:1;text-align:center;min-width:0}.wbar b{display:block;font-size:17px;font-weight:900}.wbar span{font-size:12.5px;color:var(--mute)}
.wbar em{font-style:normal;color:var(--red);font-weight:800}
.nb{flex:none;width:46px;height:46px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-size:26px;font-weight:900;line-height:1}

.x{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--mute);line-height:1}

.ses .d{flex:none;width:46px;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:5px 0;line-height:1.1}
.ses .d b{display:block;font-size:18px;font-weight:900}.ses .d i{font-style:normal;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ses .t{flex:1;min-width:0}.ses .t b{display:block;font-weight:800}.ses .t span{display:block;font-size:12.5px;color:var(--mute)}
.pill{background:#ececea;color:var(--mute)}
.addx{display:flex;gap:8px;margin-top:10px;align-items:stretch}.addx input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-height:42px;background:#fff}

es"}, {"id": "c123", "b": "nh", "g": "Normas de juego", "t": "Mientras se está en la pista, no se descansa"}, {"id": "c124", "b": "nh", "g": "Normas de juego", "t": "No mas de 3 segundos para sacar desde cualquier posición"}, {"id": "c125", "b": "nh", "g": "Añadido desde la planificación", "t": "Rebote constante en cualquier situacion de juego"}, {"id": "c126", "b": "nh", "g": "Añadido desde la planificación", "t": "Si mi compañero ha botado, no boto"}, {"id": "c127", "b": "nh", "g": "Añadido desde la planificación", "t": "Atacar lado contrario del que recibo"}, {"id": "c128", "b": "tc", "g": "Añadido desde la planificación", "t": "Desocupar una posicion si viene mi compañero, sobretodo corte fondo pierna"}, {"id": "c129", "b": "tai", "g": "Añadido desde la planificación", "t": "Subir posiciones en busca de balón, sobretodo \"pierna\""}, {"id": "c130", "b": "tc", "g": "Añadido desde la planificación", "t": "Alejar/subir todas posiciones buscando fluidez, paso hacia el balón para atacar"}], "codigos": [{"t": "Muro", "s": "Defensa estando delante, busqueda de posicion defensiva para parar con el cuerpo."}, {"t": "Barrer", "s": "En defensas en desplazamientos, buscar meter la mano muy baja cuando se busca un cambio de mano por parte del rival."}, {"t": "Casa", "s": "Sinonimo de balance."}, {"t": "Balon", "s": "Accion de ir hacia el balon para que este no avance, o emparejarse con el manejador."}, {"t": "Picar", "s": "Tocar al par defensivo de manera constante: tocar cuerpo, meter mano al balon y separarse. El uso de mano conlleva uso de pies para acercar/alejar."}, {"t": "Limpia", "s": "Dejar espacios para jugar 1x1 fuera del triple grande."}, {"t": "Baila", "s": "Concepto para que los jugadores se muevan sin balon, ya sean cortes o apoyos a penetraciones."}, {"t": "Rueda", "s": "Concepto de cambiar el balon de lado."}, {"t": "Cerca", "s": "Comunicar que estoy situado en el lado de ayudas."}, {"t": "Pescar", "s": "Concepto de rebote: me pego y voy siempre hacia el."}, {"t": "Verde", "s": "Concepto de atacar 1x1."}, {"t": "Rojo", "s": "Concepto de que hay que compartir la pelota."}, {"t": "Hielo", "s": "Defensa 1x1 a toda pista, fomentando que no me superen sin dejar de ser agresivo."}, {"t": "Fuego", "s": "Defensa de saltar al balon e ir rotando."}, {"t": "Volar", "s": "Salida al contraataque"}, {"t": "Linea", "s": "Estar en linea de pase"}, {"t": "Manos (provisional)", "s": "Enseñar las manos, una arriba otra cadera"}]};</script>
<script>(function(){
"use strict";
var LOGO=window.LOGO,SEED=window.SEED;
var KEY="alevinA.plan.v1",CKEY="alevinA.plan.cache";
var VERSION="1.8";
var BLK=[["ti","Técnica individual"],["tai","Táctica individual"],["tc","Táctica colectiva"],["d1","Defensa 1x1"],["dc","Defensa colectiva"],["nh","Normas / hábitos"]];
var BN={};BLK.forEach(function(b){BN[b[0]]=b[1];});
var BC={ti:"#ff5a6e",tai:"#4aa3ff",tc:"#f5a524",d1:"#b18cff",dc:"#2ec4a5",nh:"#f472b6"};
function bc(k){return' style="--bc:'+BC[k]+'"';}
var TRI=["","1º trimestre","2º trimestre","3º trimestre","Postemporada"];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var DIAC=["dom","lun","mar","mié","jue","vie","sáb"];
var ENTRENO=[1,3,4]; // martes, jueves y viernes (desplazamiento desde el lunes)

var A=window.__app={onSave:null,login:null,logout:null};
function seedDocs(){
  var d=SEED.weeks.map(function(w){return JSON.parse(JSON.stringify(w));});
  d.push({id:"config",k:"c",banco:SEED.banco,codigos:SEED.codigos,seq:SEED.banco.length});
  return d;
}
function load(){
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s||!Array.isArray(s.docs)||!s.docs.length)s={docs:seedDocs()};
  return s;
}
function loadCache(){var c=null;try{c=JSON.parse(localStorage.getItem(CKEY));}catch(e){}return c||{roster:[],matches:[]};}
var S=load(),C=loadCache(),saveFail=false,GN={};
try{GN=JSON.parse(localStorage.getItem("alevinA.plan.gn"))||{};}catch(e){}
function cargarGN(){if(!/^https?:$/.test(location.protocol))return;fetch("gn.json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(!j||!j.f)return;var txt=JSON.stringify(j.f);if(txt===JSON.stringify(GN))return;GN=j.f;try{localStorage.setItem("alevinA.plan.gn",txt);}catch(e){}soft();}).catch(function(){});}
function pdfSes(s){return s.gn||pdfDe(s.fecha);}
function pdfDe(f){var x=GN[f];return x?"https://drive.google.com/file/d/"+x.id+"/view":"";}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFail=false;}catch(e){saveFail=true;}}
function storeCache(){try{localStorage.setItem(CKEY,JSON.stringify(C));}catch(e){}}
function save(){store();if(A.onSave)A.onSave();}
var ui={tv:"tabla",tt:"",tc:false,pg:"",edit:null,tab:"hoy",wn:null,sid:null,pick:null,q:"",bf:"todos",bb:"",bseg:"banco",confirm:null,auth:"loading",user:"",sync:"pend",syncTxt:"Conectando con la nube…",loginErr:"",loginBusy:false};
var pendingRender=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ]+/g," ").trim();}

/* ---------- fechas ---------- */
function pd(s){var p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return p?new Date(+p[1],+p[2]-1,+p[3],12):null;}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function hoy(){return window.__hoy||iso(new Date());}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dmy(f){var d=pd(f);return d?d.getDate()+"-"+(d.getMonth()+1)+"-"+String(d.getFullYear()).slice(2):"";}
function corta(s){var d=pd(s);return d?DIAC[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1):"";}
function larga(s){var d=pd(s);return d?DIAS[d.getDay()]+" "+d.getDate()+" de "+MESL[d.getMonth()]:"";}
function rango(w){var a=pd(w.lunes),b=pd(add(w.lunes,6));return a.getMonth()===b.getMonth()?a.getDate()+"–"+b.getDate()+" "+MESES[a.getMonth()]:a.getDate()+" "+MESES[a.getMonth()]+" – "+b.getDate()+" "+MESES[b.getMonth()];}

/* ---------- datos ---------- */
function weeks(){return S.docs.filter(function(d){return d.k==="w";}).sort(function(a,b){return a.n-b.n;});}
function week(n){for(var i=0;i<S.docs.length;i++)if(S.docs[i].k==="w"&&S.docs[i].n===n)return S.docs[i];return null;}
function cfg(){for(var i=0;i<S.docs.length;i++)if(S.docs[i].id==="config")return S.docs[i];var c={id:"config",k:"c",banco:[],codigos:[],seq:0};S.docs.push(c);return c;}
function weekOf(f){var ws=weeks();for(var i=0;i<ws.length;i++)if(ws[i].lunes<=f&&f<=add(ws[i].lunes,6))return ws[i];return null;}
function curWeek(){var t=hoy(),ws=weeks(),w=weekOf(t);if(w)return w;for(var i=0;i<ws.length;i++)if(ws[i].lunes>t)return ws[i];return ws[ws.length-1];}
function getDoc(id){for(var i=0;i<S.docs.length;i++)if(S.docs[i].id===id)return S.docs[i];return null;}
function sesOf(f,x){var id="s_"+f+(x?"_"+x:"");return getDoc(id)||{id:id,k:"s",fecha:f,extra:!!x,v:1};}
function persist(s){if(s.v){delete s.v;S.docs.push(s);}return s;}
function sesionesSemana(w){
  var out=ENTRENO.map(function(o){return sesOf(add(w.lunes,o));}),fin=add(w.lunes,6),ids={};
  out.forEach(function(s){ids[s.id]=1;});
  S.docs.forEach(function(d){if(d.k==="s"&&!ids[d.id]&&d.fecha>=w.lunes&&d.fecha<=fin){out.push(d);ids[d.id]=1;}});
  // Un PDF de GoodNotes en un día sin entrenamiento habitual cuenta como entrenamiento extra.
  Object.keys(GN).forEach(function(f){if(f<w.lunes||f>fin)return;if(out.some(function(x){return x.fecha===f;}))return;out.push(sesOf(f,"x1"));});
  return out.sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.id<b.id?-1:1;});
}
function sesiones(){return S.docs.filter(function(d){return d.k==="s";});}
function nAsis(s){return Object.keys(s.asis||{}).length;}
function nHecho(s){var n=0;Object.keys(s.hecho||{}).forEach(function(k){n+=(s.hecho[k]||[]).length;});return n;}
/* Los entrenamientos habituales ya pasados cuentan como hechos salvo que se marquen «No hubo». */
function hecha(s){return s.estado==="hecho"||(!s.estado&&(!s.extra||!!GN[s.fecha])&&s.fecha<hoy()&&!!weekOf(s.fecha));}
function todasSesiones(){var out=[];weeks().forEach(function(w){out=out.concat(sesionesSemana(w));});var ids={};out.forEach(function(x){ids[x.id]=1;});sesiones().forEach(function(x){if(!ids[x.id])out.push(x);});return out;}
function estadoSes(s){
  if(s.estado==="no")return["bad","No hubo"];
  if(hecha(s))return["ok","Hecho"];
  if(s.fecha<hoy())return["warn","Sin registrar"];
  if(s.fecha===hoy())return["warn","Hoy"];
  return["","Previsto"];
}
function proxima(){
  var t=hoy(),best=null;
  sesiones().forEach(function(s){if(s.fecha>=t&&s.estado!=="no"&&(!best||s.fecha<best.fecha))best=s;});
  for(var i=0;i<21;i++){var f=add(t,i),d=pd(f).getDay();if(d===2||d===4||d===5){var s=sesOf(f);if(s.estado==="no")continue;if(!best||f<best.fecha)best=s;break;}}
  return best;
}
function roster(){return(C.roster||[]).slice().sort(function(a,b){return(parseInt(a.num,10)||0)-(parseInt(b.num,10)||0);});}
function corto(p){var n=String(p.name||"").trim().split(/\s+/);return n.length>1?n[0]+" "+n[1].charAt(0)+".":n[0]||"";}
function partidosEntre(a,b){return(C.matches||[]).filter(function(m){return m.fecha&&m.fecha>=a&&m.fecha<=b;}).sort(function(x,y){return x.fecha<y.fecha?-1:1;});}

/* Recuento por contenido: semanas en que está planificado y sesiones en que se ha trabajado. */
function recuento(){
  var r={};
  function g(t){var k=norm(t);if(!r[k])r[k]={plan:0,trab:0,ult:0,ultW:0};return r[k];}
  weeks().forEach(function(w){BLK.forEach(function(b){(w.b[b[0]]||[]).forEach(function(t){var o=g(t);o.plan++;if(w.n>o.ult)o.ult=w.n;});});});
  // Una semana cuenta como trabajada si ya ha empezado y tiene algún entrenamiento hecho: todos sus contenidos suman.
  weeks().forEach(function(w){if(w.lunes>hoy()||!sesionesSemana(w).some(hecha))return;BLK.forEach(function(b){(w.b[b[0]]||[]).forEach(function(t){var o=g(t);o.trab++;if(w.n>o.ultW)o.ultW=w.n;});});});
  return r;
}
function planHasta(){var n=0;weeks().forEach(function(w){if(BLK.some(function(b){return(w.b[b[0]]||[]).length;}))n=w.n;});return n;}

/* ---------- render ---------- */
function render(){
  pendingRender=false;
  var hd='<img src="'+LOGO+'" alt="Fundación CB Granada">';
  if(ui.auth!=="in"){
    $("hd").innerHTML=hd+'<div class="h-t"><b>Planificación</b><span>Alevín A · Temporada 2026/27</span></div>';
    $("nav").innerHTML="";document.querySelector("nav").style.display="none";
    $("main").innerHTML=ui.auth==="loading"?'<div class="card empty">Cargando…</div>':vLogin();
    return;
  }
  document.querySelector("nav").style.display="";
  var s=ui.sid?sesOf.apply(null,splitSid(ui.sid)):null;
  if(s)hd+='<div class="h-t"><b>'+esc(cap(larga(s.fecha)))+'</b><span>'+(s.extra?"Entrenamiento extra":"Entrenamiento")+(weekOf(s.fecha)?" · Semana "+weekOf(s.fecha).n:"")+'</span></div>'+dot()+'<button class="back" data-a="cerrar">Volver</button>';
  else hd+='<div class="h-t"><b>'+{hoy:"Hoy",semana:"Semana",temporada:"Temporada",banco:"Contenidos",ajustes:"Ajustes"}[ui.tab]+'</b><span>Planificación · Alevín A 2026/27</span></div>'+dot();
  $("hd").innerHTML=hd;
  $("nav").innerHTML=[["hoy","Hoy"],["semana","Semana"],["temporada","Temporada"],["banco","Contenidos"],["ajustes","Ajustes"]].map(function(x){
    return'<button data-a="tab" data-v="'+x[0]+'" class="'+(ui.tab===x[0]?"on":"")+'">'+x[1]+'</button>';}).join("");
  var h="";
  if(saveFail)h+='<div class="estado bad"><b>No se pueden guardar los datos</b>Este navegador no permite almacenamiento.</div>';
  if(s)h+=vSesion(s);
  else if(ui.tab==="hoy")h+=vHoy();
  else if(ui.tab==="semana")h+=vSemana();
  else if(ui.tab==="temporada")h+=vTemporada();
  else if(ui.tab==="banco")h+=vBanco();
  else h+=vAjustes();
  if(ui.pick)h+=vPicker();
  $("main").innerHTML=h;
  document.body.classList.toggle("modal",!!ui.pick);
}
function splitSid(id){var p=id.replace(/^s_/,"").split("_");return[p[0],p[1]];}
function dot(){return'<span id="dot" class="dot '+ui.sync+'" role="img" aria-label="'+esc(ui.syncTxt)+'" title="'+esc(ui.syncTxt)+'"></span>';}
function vLogin(){
  var h='<form id="lf" class="card login"><h2>Iniciar sesión</h2>';
  if(ui.loginErr)h+='<div class="err" role="alert">'+esc(ui.loginErr)+'</div>';
  h+='<label class="f">Correo<input type="email" id="le" autocomplete="username" autocapitalize="none" required></label>';
  h+='<label class="f">Contraseña<input type="password" id="lp" autocomplete="current-password" required></label>';
  h+='<button class="btn block" type="submit" '+(ui.loginBusy?"disabled":"")+'>'+(ui.loginBusy?"Entrando…":"Entrar")+'</button>';
  return h+'<p class="hint">Es el mismo usuario y contraseña que en la app de partidos.</p></form>';
}
function chips(arr){return(arr||[]).map(function(t){return'<span class="chip">'+esc(t)+'</span>';}).join("");}
function cod(t){var c=cfg().codigos||[];for(var i=0;i<c.length;i++)if(norm(c[i].t)===norm(t))return c[i].s;return"";}

/* HOY: ficha del día, todo en una pantalla */
function vHoy(){
  var s=proxima(),h="";
  if(!s)return'<div class="card empty"><b>No hay entrenamientos próximos</b></div>';
  var w=weekOf(s.fecha),t=hoy();
  h+='<button class="hero" data-a="ses" data-v="'+s.id+'"><span>'+(s.fecha===t?"Hoy":"Próximo entrenamiento")+'</span><b>'+esc(cap(larga(s.fecha)))+'</b>'+(w?'<i>Semana '+w.n+' · '+esc(w.mes)+' '+w.sem+'</i>':'<i>Semana sin planificar</i>')+'</button>';
  if(pdfSes(s))h+='<a class="btn block gn pdfbig" href="'+esc(pdfSes(s))+'" target="_blank" rel="noopener">Abrir entrenamiento (PDF)</a>';
  else h+='<p class="sub" style="margin:-4px 2px 12px">Aún no hay PDF de este día en GoodNotes.</p>';
  var ps=partidosEntre(t,add(t,7));
  if(ps.length)h+='<div class="card mini"><h2>Próximo partido</h2>'+ps.slice(0,1).map(function(m){return'<b>'+esc(corta(m.fecha))+(m.hora?" · "+esc(m.hora):"")+'</b> · '+(m.cond==="V"?"en casa de ":"vs ")+esc(m.rival||"Rival por definir");}).join("")+'</div>';
  if(w){
    h+='<div class="card"><h2>Objetivo de la semana</h2>'+(w.obj?'<p class="obj">'+esc(w.obj)+'</p>':'<p class="sub" style="margin:0">Sin objetivo. Puedes ponerlo en la pestaña Semana.</p>')+'</div>';
    h+=contenidosSemana(w);
    if((w.terms||[]).length)h+='<div class="card"><h2>Términos de la semana</h2>'+w.terms.map(function(t){var d=cod(t);return'<div class="term"><b>'+esc(t)+'</b>'+(d?'<span>'+esc(d)+'</span>':'')+'</div>';}).join("")+'</div>';
  }
  return h+asistencia(s)+valoracion(s);
}
/* Contenidos de la semana en formato compacto, por bloques y con sus colores (solo lectura) */
function contenidosSemana(w){
  var h='<div class="card"><h2>Contenidos de la semana</h2>',n=0;
  BLK.forEach(function(b){var l=w.b[b[0]]||[];if(!l.length)return;n+=l.length;

  (cfg().codigos||[]).forEach(function(c,i){if(ui.edit==="cd:"+i){h+='<div class="it ed"><label class="f">Término<input id="ec_t" value="'+esc(c.t)+'"></label><label class="f">Significado<textarea id="ec_s" rows="2">'+esc(c.s)+'</textarea></label><div class="row"><button class="btn sm" data-a="cdsave" data-v="'+i+'">Guardar</button><button class="btn ghost sm" data-a="ecancel">Cancelar</button></div></div>';return;}
    h+='<div class="it"><button class="itb" data-a="edit" data-v="cd:'+i+'"><b>'+esc(c.t)+'</b><small>'+esc(c.s)+'</small></button>'+(ui.confirm==="delt"+i?'<button class="btn danger sm" data-a="delt" data-v="'+i+'">Borrar</button>':'<button class="x" data-a="askdelt" data-v="'+i+'" aria-label="Borrar '+esc(c.t)+'">×</button>')+'</div>';});
  h+='</div><div class="card"><h2>Nuevo término</h2><label class="f">Término<input id="ct"></label><label class="f" style="margin-top:10px">Significado<textarea id="cs" rows="2"></textarea></label><button class="btn block" data-a="nuevot" style="margin-top:10px">Añadir</button></div>';
  return h;
}
function vAjustes(){
  var h='<div class="card"><h2>Cuenta</h2><p style="margin:0 0 6px"><b>'+esc(ui.user)+'</b></p><p class="sub" id="synctxt" style="margin:0 0 10px">'+esc(ui.syncTxt)+'</p>';
  h+=ui.confirm==="salir"?'<button class="btn danger block" data-a="salir">¿Seguro? Cerrar sesión</button>':'<button class="btn ghost block" data-a="asksalir">Cerrar sesión</button>';
  h+='</div><div class="card"><h2>GoodNotes</h2><p style="margin:0;font-size:14px">Cada entrenamiento tiene un campo para el enlace de su documento de GoodNotes. Al pegarlo, el botón «Abrir la sesión» lo abre directamente en el iPad o en el móvil.</p></div>';
  h+='<div class="card"><h2>Acerca de</h2><p style="margin:0;font-size:14px">Planificación Alevín A · versión '+VERSION+'<br><span class="sub">'+weeks().length+' semanas · '+(cfg().banco||[]).length+' contenidos · '+sesiones().length+' entrenamientos guardados</span></p></div>';
  return h;
}

/* ---------- acciones ---------- */
function toast(t){var d=$("toast");if(!d){d=document.createElement("div");d.id="toast";d.setAttribute("role","status");document.body.appendChild(d);}d.textContent=t;d.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){d.className="";},2200);}
function rerenderKeepScroll(){var y=window.scrollY,pl=document.querySelector(".plist"),py=pl?pl.scrollTop:0;render();window.scrollTo(0,y);var p2=document.querySelector(".plist");if(p2)p2.scrollTop=py;}
function sesById(id){var p=splitSid(id);return persist(sesOf(p[0],p[1]));}
document.addEventListener("click",function(e){
  if(e.target.closest("a"))return;
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.dataset.a,v=b.dataset.v,keep=true,w=week(ui.wn);
  if(a.indexOf("ask")!==0)ui.confirm=null;
  if(["tab","wn","verw","cerrar","ses","pick","bseg"].indexOf(a)>=0)ui.edit=null;
  switch(a){
    case"edit":ui.edit=v;break;
    case"ecancel":ui.edit=null;break;
    case"wisave":var nt2=($("ed_t").value||"").replace(/\s+/g," ").trim();if(!nt2){toast("El contenido no puede quedar vacío");return;}var old=w.b[b.dataset.b][+b.dataset.i];w.b[b.dataset.b][+b.dataset.i]=nt2;sesionesSemana(w).forEach(function(x){var hl=(x.hecho||{})[b.dataset.b];if(hl)hl.forEach(function(t,k){if(t===old)hl[k]=nt2;});});ui.edit=null;save();break;
    case"mover":var L2=w.b[b.dataset.b],i2=+b.dataset.i,j2=i2+(+v);var tmp=L2[i2];L2[i2]=L2[j2];L2[j2]=tmp;ui.edit="wi:"+b.dataset.b+":"+j2;save();break;
    case"ewsave":var l0=$("ew_l").value;if(!pd(l0)){toast("Fecha no válida");return;}if(pd(l0).getDay()!==1){l0=add(l0,(1-pd(l0).getDay()-7)%7);toast("Ajustada al lunes "+corta(l0));}w.lunes=l0;w.mes=($("ew_m").value||"").trim()||w.mes;w.sem=+$("ew_s").value||w.sem;w.tri=+$("ew_t").value;ui.edit=null;save();break;
    case"askdelw":ui.confirm="delw";break;
    case"delw":S.docs=S.docs.filter(function(d){return d!==w;});ui.edit=null;ui.wn=null;save();toast("Semana borrada");keep=false;break;
    case"askcopiar":ui.confirm="copiar";break;
    case"copiar":var pw=week(w.n-1);w.b=JSON.parse(JSON.stringify(pw.b));w.terms=(pw.terms||[]).slice();if(!w.obj)w.obj=pw.obj||"";save();toast("Contenidos copiados de la semana "+pw.n);break;
    case"nuevaw":var wl=weeks(),last=wl[wl.length-1],nn=last?last.n+1:1,lun=last?add(last.lunes,7):iso(new Date()),dl=pd(lun);var nw={id:"w"+("0"+nn).slice(-2),k:"w",n:nn,tri:last?last.tri:1,mes:MESL[dl.getMonth()].charAt(0).toUpperCase()+MESL[dl.getMonth()].slice(1),sem:Math.ceil(dl.getDate()/7),lunes:lun,obj:"",b:{},terms:[]};BLK.forEach(function(x){nw.b[x[0]]=[];});S.docs.push(nw);save();ui.wn=nn;ui.tab="semana";ui.edit="week";keep=false;toast("Semana "+nn+" creada");break;
    case"bcsave":var bc=bancoItem(v),ntx=($("eb_t").value||"").replace(/\s+/g," ").trim();if(!ntx){toast("El contenido no puede quedar vacío");return;}renombrar(bc.t,ntx);bc.t=ntx;bc.b=$("eb_b").value;bc.g=($("eb_g").value||"").trim()||bc.g;ui.edit=null;save();toast("Contenido actualizado");break;
    case"cdsave":var cdd=cfg().codigos[+v],ot=cdd.t;cdd.t=($("ec_t").value||"").trim()||cdd.t;cdd.s=($("ec_s").value||"").trim();if(norm(ot)!==norm(cdd.t))weeks().forEach(function(x){(x.terms||[]).forEach(function(t,k){if(norm(t)===norm(ot))x.terms[k]=cdd.t;});});ui.edit=null;save();break;
    case"tab":ui.tab=v;ui.sid=null;ui.pick=null;ui.q="";keep=false;break;
    case"cerrar":ui.sid=null;keep=false;break;
    case"ses":ui.sid=v;ui.pick=null;keep=false;break;
    case"wn":ui.wn=+v;keep=false;break;
    case"verw":ui.wn=+v;ui.tab="semana";keep=false;break;
    case"tv":ui.tv=v;break;
    case"tt":ui.tt=v;break;
    case"tc":ui.tc=!ui.tc;break;
    case"estado":var s=sesById(b.dataset.s);s.estado=v;if(!s.estado)delete s.estado;save();break;
    case"val":var sv=sesById(b.dataset.s);sv.val=sv.val===v?"":v;if(!sv.val)delete sv.val;if(!sv.estado&&sv.fecha<=hoy())sv.estado="hecho";save();break;
    case"asis":s=sesById(b.dataset.s);if(!s.asis)s.asis={};if(s.asis[v])delete s.asis[v];else s.asis[v]=1;if(!s.estado&&s.fecha<=hoy())s.estado="hecho";save();break;
    case"asistodos":s=sesById(b.dataset.s);if(nAsis(s))s.asis={};else{s.asis={};roster().forEach(function(p){s.asis[p.id]=1;});if(!s.estado&&s.fecha<=hoy())s.estado="hecho";}save();break;
    case"hecho":s=sesById(b.dataset.s);var ws=weekOf(s.fecha),t=ws.b[b.dataset.b][+b.dataset.i];if(!s.hecho)s.hecho={};var l=s.hecho[b.dataset.b]||(s.hecho[b.dataset.b]=[]),ix=l.indexOf(t);if(ix>=0)l.splice(ix,1);else l.push(t);if(!l.length)delete s.hecho[b.dataset.b];if(!s.estado&&s.fecha<=hoy())s.estado="hecho";save();break;
    case"askdels":ui.confirm="dels";break;
    case"dels":S.docs=S.docs.filter(function(d){return d.id!==b.dataset.s;});ui.sid=null;save();toast("Entrenamiento eliminado");keep=false;break;
    case"extra":var f=($("xf")||{}).value;if(!f){toast("Elige la fecha");return;}var x=1;while(getDoc("s_"+f+"_x"+x))x++;var ns={id:"s_"+f+"_x"+x,k:"s",fecha:f,extra:true};S.docs.push(ns);save();ui.sid=ns.id;keep=false;toast("Entrenamiento extra añadido");break;
    case"pick":ui.pick=v;ui.q="";ui.pg="";keep=false;break;
    case"pg":ui.pg=v;break;
    case"cpick":ui.pick=null;ui.q="";keep=false;break;
    case"ptog":var c=bancoItem(v);if(!c)return;var L=w.b[c.b]||(w.b[c.b]=[]),k=L.map(norm).indexOf(norm(c.t));if(k>=0)L.splice(k,1);else L.push(c.t);save();break;
    case"pnuevo":var nt=($("pn").value||"").trim();if(!nt)return;var cf=cfg();cf.seq=(cf.seq||cf.banco.length)+1;var ni={id:"c"+cf.seq,b:ui.pick,g:"Nuevos",t:nt};cf.banco.push(ni);(w.b[ui.pick]||(w.b[ui.pick]=[])).push(nt);save();toast("Contenido creado y añadido");break;
    case"quitar":w.b[b.dataset.b].splice(+b.dataset.i,1);save();break;
    case"qterm":w.terms.splice(+b.dataset.i,1);save();break;
    case"bseg":ui.bseg=v;ui.q="";keep=false;break;
    case"askdelc":ui.confirm="delc"+v;break;
    case"delc":cf=cfg();cf.banco=cf.banco.filter(function(x){return x.id!==v;});save();toast("Contenido borrado del banco");break;
    case"nuevoc":var tt=($("nt").value||"").trim();if(!tt){toast("Escribe el contenido");return;}cf=cfg();cf.seq=(cf.seq||cf.banco.length)+1;cf.banco.push({id:"c"+cf.seq,b:$("nb").value,g:($("ng").value||"").trim()||"Nuevos",t:tt});save();toast("Contenido añadido");break;
    case"askdelt":ui.confirm="delt"+v;break;
    case"delt":cfg().codigos.splice(+v,1);save();break;
    case"nuevot":var ct=($("ct").value||"").trim();if(!ct)return;cfg().codigos.push({t:ct,s:($("cs").value||"").trim()});save();toast("Término añadido");break;
    case"asksalir":ui.confirm="salir";break;
    case"salir":if(A.logout)A.logout();return;
    default:return;
  }
  if(keep)rerenderKeepScroll();else{render();window.scrollTo(0,0);}
});
/* Cambia un texto de contenido en todas las semanas y entrenamientos. */
function renombrar(de,a){
  if(de===a)return;var k=norm(de);
  S.docs.forEach(function(d){
    if(d.k==="w")BLK.forEach(function(b){var l=d.b[b[0]]||[];l.forEach(function(t,i){if(norm(t)===k)l[i]=a;});});
    if(d.k==="s"&&d.hecho)Object.keys(d.hecho).forEach(function(x){d.hecho[x].forEach(function(t,i){if(norm(t)===k)d.hecho[x][i]=a;});});
  });
}
function bancoItem(id){var l=cfg().banco||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
document.addEventListener("input",function(e){
  var t=e.target,d=t.dataset;
  if(t.id==="pq"||t.id==="bq"){ui.q=t.value;var pos=t.selectionStart;rerenderKeepScroll();var n=$(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(d.k==="obj"){week(ui.wn).obj=t.value;}
  else if(d.k==="gn"||d.k==="notas"){var s=sesById(d.s);s[d.k]=t.value.trim()?(d.k==="gn"?t.value.trim():t.value):"";if(!s[d.k])delete s[d.k];if(d.k==="gn"){var g=$("gnbtn");if(g){g.href=s.gn||"#";g.hidden=!s.gn;}}}
  else return;
  save();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="tsel"&&t.value){var w=week(ui.wn);(w.terms||(w.terms=[])).push(t.value);save();rerenderKeepScroll();}
  if(t.id==="bb"){ui.bb=t.value;rerenderKeepScroll();}
  if(t.id==="bf"){ui.bf=t.value;rerenderKeepScroll();}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.pick){ui.pick=null;render();}});
document.addEventListener("submit",function(e){
  if(e.target.id!=="lf")return;e.preventDefault();
  if(!A.login){ui.loginErr="La sincronización no se ha cargado. Recarga la página con conexión.";render();return;}
  var em=$("le").value,pw=$("lp").value;ui.loginBusy=true;ui.loginErr="";render();$("le").value=em;A.login(em,pw);
});
function typing(){var a=document.activeElement;return!!a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"&&a.type!=="date"));}
document.addEventListener("focusout",function(){if(pendingRender)setTimeout(function(){if(pendingRender&&!typing())rerenderKeepScroll();},60);});

A.ui=ui;A.render=render;A.recuento=recuento;A.proxima=proxima;
A.getState=function(){return S;};
A.setAuth=function(st,email){ui.auth=st;ui.user=email||"";ui.loginBusy=false;if(st!=="in"){ui.sid=null;ui.tab="hoy";}render();};
A.loginResult=function(err){ui.loginBusy=false;ui.loginErr=err||"";if(err)render();};
A.setSync=function(code,txt){ui.sync=code;ui.syncTxt=txt;var d=$("dot");if(d){d.className="dot "+code;d.title=txt;d.setAttribute("aria-label",txt);}var t=$("synctxt");if(t)t.textContent=txt;};
function soft(){if(ui.auth!=="in")return;if(typing())pendingRender=true;else rerenderKeepScroll();}
A.applyRemote=function(docs){S.docs=docs||[];store();if(ui.sid&&ui.sid.indexOf("_x")>0&&!getDoc(ui.sid))ui.sid=null;soft();};
A.setTeam=function(t){C.roster=(t&&t.roster)||[];storeCache();soft();};
A.setMatches=function(l){C.matches=(l||[]).map(function(m){return{id:m.id,fecha:m.fecha,hora:m.hora,rival:m.rival,cond:m.cond,comp:m.comp};});storeCache();soft();};
A.clearLocal=function(){try{localStorage.removeItem(KEY);localStorage.removeItem(CKEY);}catch(e){}S=load();C=loadCache();};

cargarGN();window.addEventListener("focus",cargarGN);document.addEventListener("visibilitychange",function(){if(!document.hidden)cargarGN();});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
