<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Partidos Alevín A</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Alevín A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#111214; --red:#c8102e; --red-d:#9d0c24; --paper:#f4f4f2; --card:#fff;
  --line:#dcdcd8; --mute:#6b6d70; --ok:#1e7a3c; --ok-bg:#e3f3e8; --warn:#a86a00; --warn-bg:#fdf1d6;
  --bad:#b3122b; --bad-bg:#fbe3e7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:#fff;padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--ink);box-shadow:0 3px 0 var(--red)}
header img{height:44px;width:auto;flex:none}
.h-t{flex:1;min-width:0}
.h-t b{display:block;font-size:19px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-t span{display:block;font-size:11px;font-weight:800;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;border:0;background:var(--ink);color:#fff;border-radius:8px;height:36px;padding:0 12px;font-weight:800;font-size:13px}

main{flex:1;padding:14px 12px calc(84px + var(--sab))}

/* pestañas del partido */
.seg{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px}
.seg button.on{background:var(--red)}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding-bottom:var(--sab)}
nav div{max-width:820px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:#a9abae;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:15px 4px 14px;border-top:3px solid transparent}
nav button.on{color:#fff;border-top-color:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;padding-left:9px;border-left:5px solid var(--red);line-height:1.2}
.sub{color:var(--mute);font-size:13px}

/* formulario */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .w2{grid-column:1/-1}
label.f{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
label.f input,label.f select,textarea,.inp{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);min-height:42px}
textarea{resize:vertical;font-weight:500;line-height:1.4}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.lv{display:flex;gap:6px;margin-top:4px}
.lv button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;min-height:42px;font-weight:800;font-size:13px;letter-spacing:.04em}
.lv button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:12px 16px;font-size:14px;letter-spacing:.03em}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

.dot{flex:none;width:11px;height:11px;border-radius:50%;background:#b9bbbd}
.dot.ok{background:var(--ok)} .dot.pend{background:#d99a00} .dot.bad{background:var(--bad)}
.login{max-width:420px;margin:28px auto 0}
.login label.f{margin-bottom:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;font-weight:700;font-size:14px;margin-bottom:12px}
/* lista de partidos */
.m{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.m .d{flex:none;width:52px;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:6px 0;line-height:1.1}
.m .d b{display:block;font-size:19px;font-weight:900}
.m .d i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.m .t{flex:1;min-width:0}
.m .t b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t span{display:block;font-size:12.5px;color:var(--mute)}
.pill{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}

/* convocatoria */
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.num{flex:none;width:34px;text-align:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.pl .n{flex:1;min-width:0;font-weight:700}
.pl .n input{margin-top:5px;font-size:14px;min-height:36px;padding:6px 9px;font-weight:500}
.chk{flex:none;width:46px;height:38px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:17px;color:#fff}
.chk.on{background:var(--ink)}
.pl.off .n>span,.pl.off .num{color:var(--mute)}
.count{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.count b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}

/* sextos */
.estado{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-weight:700;border:1px solid}
.estado.ok{background:var(--ok-bg);color:var(--ok);border-color:#b9dfc5}
.estado.warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d79a}
.estado.bad{background:var(--bad-bg);color:var(--bad);border-color:#f1b9c2}
.estado b{display:block;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.estado ul{margin:6px 0 0;padding-left:18px;font-weight:600;font-size:13.5px}
.sx-wrap{overflow-x:auto}
table.sx{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
.sx col.cw{width:29%}
.card.flush{margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0;padding:8px 6px 12px}
.card.flush .hint{padding:0 6px}
.sx th{background:var(--ink);color:#fff;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:7px 2px;text-align:center}
.sx th.r{background:var(--red)}
.sx th.g{background:#3a3c40}
.sx th:first-child{border-radius:8px 0 0 0;text-align:left;padding-left:8px}
.sx th:last-child{border-radius:0 8px 0 0}
.sx td{border-bottom:1px solid var(--line);padding:3px 2px;text-align:center;background:#fff}
.sx tr:nth-child(even) td{background:#f1f1ef}
.sx td.who{text-align:left;padding:4px 4px 4px 2px}
.sx td.who div{display:flex;align-items:center;gap:6px}
.sx td.who b{flex:none;width:26px;text-align:center;font-weight:900;font-size:15px}
.sx td.who span{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx tr.out td.who span{text-decoration:line-through;color:var(--mute)}
.cell{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;color:#fff;padding:0}
.cell.on{background:var(--ink);border-color:var(--ink)}
.cell.six.on{background:#3a3c40;border-color:#3a3c40}
.tot{display:block;border-radius:7px;padding:8px 0;font-weight:900;font-size:15px}
.tot.ok{background:var(--ok-bg);color:var(--ok)}
.tot.warn{background:var(--warn-bg);color:var(--warn)}
.tot.bad{background:var(--bad-bg);color:var(--bad)}
.fal{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;padding:0}
.fal.f4{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fal.f5{background:var(--bad);border-color:var(--bad);color:#fff}
.sx tfoot td{background:#fff!important;border-bottom:0;padding-top:7px;font-weight:900;font-size:13px}
.sx tfoot td.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-left:8px}
.cnt{display:block;border-radius:999px;padding:3px 0}
.cnt.ok{background:var(--ok-bg);color:var(--ok)} .cnt.warn{background:var(--warn-bg);color:var(--warn)} .cnt.bad{background:var(--bad-bg);color:var(--bad)}
.hint{font-size:12.5px;color:var(--mute);margin-top:10px}

/* objetivos */
.ev{display:flex;gap:6px}
.ev button{width:38px;height:38px;border-radius:50%;border:2.5px solid;background:#fff;font-size:10px;font-weight:900;padding:0}
.ev .s{border-color:var(--ok);color:var(--ok)} .ev .p{border-color:#d99a00;color:#a86a00} .ev .n{border-color:var(--bad);color:var(--bad)}
.ev .s.on{background:var(--ok);color:#fff} .ev .p.on{background:#d99a00;color:#fff} .ev .n.on{background:var(--bad);color:#fff}
.ob{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.ob .hd{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;font-weight:900;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.ob .hd .ev button{width:32px;height:32px;background:transparent}
.ob .hd .ev .s.on{background:var(--ok)} .ob .hd .ev .p.on{background:#d99a00} .ob .hd .ev .n.on{background:var(--bad)}
.ob textarea{border:0;border-radius:0;margin:0}
.ind{padding:9px 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0}
.ind .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ind .top span{flex:1;min-width:0;font-weight:700}

/* normativa */
.rule{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule b{flex:none;width:58px;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--red);padding-top:2px}
.rule p{margin:0;font-size:14px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stp:first-of-type{border-top:0}
.stp span{font-weight:600;font-size:14px}
.stp div{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:18px}
.stp b{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(74px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.cell,.fal{height:42px}.sx col.cw{width:34%}.sx td.who span{font-size:15px}.card.flush{margin-left:0;margin-right:0;border-radius:12px;border:1px solid var(--line);padding:10px 12px}}
@media (prefers-reduced-motion:no-preference){.cell,.chk,.ev button{transition:background .12s}}
</style>
</head>

  <header id="hd"></header>
  <main id="main"></main>
</div>

function convocados(m){return sortedRoster().filter(function(p){return m.conv[p.id];});}
var ZERO=[0,0,0,0,0,0];
function sxOf(m,pid,create){if(!m.sx[pid]){if(!create)return ZERO;m.sx[pid]=[0,0,0,0,0,0];}return m.sx[pid];}
function totalDe(m,pid){var a=sxOf(m,pid),t=0;for(var i=0;i<5;i++)t+=a[i]?1:0;return t;}

/* ---- Comprobación de la normativa (Reglas Oficiales de Minibasket FAB, art. 4 y 19) ---- */
function check(m){
  var R=S.rules,C=convocados(m),n=C.length,maxJ=5-R.minDescanso,out={errs:[],avisos:[],sext:[],pl:{},n:n,nivel:"ok"};
  if(n===0){out.nivel="warn";out.avisos.push("Marca primero la convocatoria.");return out;}
  if(n>R.maxConv)out.errs.push("Hay "+n+" convocados: el máximo en acta es "+R.maxConv+".");
  if(n<5)out.errs.push("Con menos de 5 jugadores no se puede empezar el partido.");
  else if(n<R.minConv)out.avisos.push("Con "+n+" jugadores (menos de "+R.minConv+") el partido se juega y el árbitro lo anota al dorso del acta.");
  var imposible=n>=5&&n*maxJ<5*R.porSexto;
  if(imposible)out.avisos.push("Con "+n+" jugadores no es posible que todos descansen "+R.minDescanso+" sextos: se hacen los cambios necesarios para tener 5 en pista y el árbitro lo anota en el acta.");
  for(var s=0;s<6;s++){var c=0;C.forEach(function(p){if(sxOf(m,p.id)[s])c++;});out.sext[s]=c;}
  var faltan=[],sobran=[];
  for(s=0;s<5;s++){if(out.sext[s]<R.porSexto)faltan.push((s+1)+"º");else if(out.sext[s]>R.porSexto)sobran.push((s+1)+"º");}
  if(sobran.length)out.errs.push("Sextos con más de "+R.porSexto+" jugadores: "+lista(sobran)+".");
  var poco=[],mucho=[];
  C.forEach(function(p){
    var t=totalDe(m,p.id),st="ok";
    if(t>maxJ&&!imposible){st="bad";mucho.push(p);}
    else if(t<R.minJugar){st="warn";poco.push(p);}
    out.pl[p.id]={t:t,st:st};
  });
  if(mucho.length)out.errs.push(nombres(mucho)+(mucho.length>1?" juegan":" juega")+" más de "+maxJ+" de los 5 primeros sextos: "+(mucho.length>1?"deben":"debe")+" descansar "+R.minDescanso+" completos.");
  var completo=!faltan.length&&!sobran.length;
  if(poco.length){
    var txt=nombres(poco)+(poco.length>1?" no llegan":" no llega")+" a "+R.minJugar+" sextos completos en los 5 primeros.";
    if(completo)out.errs.push(txt);else out.avisos.push(txt);
  }
  if(faltan.length)out.avisos.push("Sextos sin completar: "+lista(faltan)+" ("+R.porSexto+" jugadores por sexto).");
  if(out.sext[5]>R.porSexto)out.avisos.push("El 6º sexto tiene "+out.sext[5]+" marcados: en el 6º hay cambios libres, marca solo el quinteto de salida.");
  var elim=C.filter(function(p){return(m.faltas[p.id]||0)>=R.faltas;});
  elim.forEach(function(p){out.pl[p.id].out=true;});
  if(elim.length)out.avisos.push(nombres(elim)+(elim.length>1?" están eliminados":" está eliminado")+" por "+R.faltas+" faltas.");
  out.nivel=out.errs.length?"bad":(faltan.length||poco.length?"warn":"ok");
  return out;
}
function lista(a){return a.length>1?a.slice(0,-1).join(", ")+" y "+a[a.length-1]:a[0];}
function nombres(ps){return lista(ps.map(function(p){return"#"+p.num+" "+p.name.split(" ")[0];}));}

  var h='<div class="card"><h2>Cuenta y sincronización</h2><div class="rule"><b>Usuario</b><p>'+esc(ui.user)+'</p></div><div class="rule"><b>Estado</b><p id="synctxt">'+esc(ui.syncTxt)+'</p></div><div class="row" style="margin-top:10px">'+(ui.confirm==="out"?'<button class="btn danger" data-a="salir" style="flex:1">¿Seguro? Cerrar sesión</button>':'<button class="btn ghost" data-a="asksalir" style="flex:1">Cerrar sesión</button>')+'</div></div>';
  h+='<div class="card"><h2>Copia de seguridad</h2><p class="sub" style="margin:0 0 10px">Los datos se sincronizan entre los dispositivos del equipo. Importar una copia sustituye los datos de todos.</p><div class="row"><button class="btn dark" data-a="exportar" style="flex:1">Exportar copia</button><label class="btn ghost" style="flex:1;text-align:center">Importar copia<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div>';
  h+='<div class="card"><h2>Instalar en el móvil</h2><div class="rule"><b>iPhone</b><p>Abre la app en Safari, pulsa Compartir y elige «Añadir a pantalla de inicio».</p></div><div class="rule"><b>Android</b><p>Abre la app en Chrome, pulsa el menú y elige «Instalar aplicación».</p></div></div>';
  h+='<div class="card"><h2>Acerca de</h2><p style="margin:0;font-size:14px">Partidos Alevín A · versión 1.1<br><span class="sub">'+S.matches.length+' partidos guardados · '+S.roster.length+' jugadores</span></p></div>';
  return h;
}

/* ---- Eventos ---- */
var toastT=null;
function toast(t){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(function(){d.remove();},2600);}
function rerenderKeepScroll(){var y=window.scrollY;render();window.scrollTo(0,y);}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,m=match(),keep=true;
  if(a!=="askdel"&&a!=="asklimpiar"&&a!=="askdelp"&&a!=="asksalir")ui.confirm=null;
  switch(a){
    case"tab":if(ui.tab==="plantilla")save();ui.tab=v;if(v==="partidos")ui.mid=null;keep=false;break;
    case"volver":ui.mid=null;keep=false;break;
    case"nuevo":ui.mid=newMatch().id;ui.sec="datos";keep=false;break;
    case"abrir":ui.mid=v;ui.sec=convocados(match()).length?"sextos":"datos";keep=false;break;
    case"sec":ui.sec=v;keep=false;break;
    case"cond":m.cond=v;break;
    case"askdel":ui.confirm="del";break;
    case"borrar":S.matches=S.matches.filter(function(x){return x.id!==m.id;});ui.mid=null;keep=false;toast("Partido eliminado");break;
    case"conv":
      if(m.conv[v])delete m.conv[v];
      else{if(convocados(m).length>=S.rules.maxConv)toast("Ya hay "+S.rules.maxConv+" convocados, el máximo en acta");m.conv[v]=true;}
      break;
    case"convtodos":
      if(convocados(m).length)m.conv={};
      else sortedRoster().slice(0,S.rules.maxConv).forEach(function(p){m.conv[p.id]=true;});
      break;
    case"sx":var arr=sxOf(m,v,true),s=+b.dataset.s;arr[s]=arr[s]?0:1;save();$("sx").innerHTML=vSextos(m);return;
    case"falta":var f=(m.faltas[v]||0)+1;if(f>S.rules.faltas)f=0;m.faltas[v]=f;save();$("sx").innerHTML=vSextos(m);return;
    case"asklimpiar":ui.confirm="clr";break;
    case"limpiar":m.sx={};m.faltas={};break;
    case"ev":
      if(b.dataset.scope==="obj"){var o=m.obj[v];o.ev=o.ev===b.dataset.e?"":b.dataset.e;}
      else{if(!m.ind[v])m.ind[v]={t:"",ev:""};m.ind[v].ev=m.ind[v].ev===b.dataset.e?"":b.dataset.e;}
      break;
    case"addp":S.seq=(S.seq||S.roster.length)+1;var mx=0;S.roster.forEach(function(p){if(p.num>mx)mx=p.num;});S.roster.push({id:"p"+S.seq+"x"+Date.now(),num:mx+1,name:"Jugador nuevo"});break;
    case"askdelp":ui.confirm="p"+v;break;
    case"delp":S.roster=S.roster.filter(function(p){return p.id!==v;});break;
    case"rule":var nv=S.rules[v]+(+b.dataset.d);if(nv<+b.dataset.min||nv>+b.dataset.max)return;S.rules[v]=nv;
      if(S.rules.minConv>S.rules.maxConv){if(v==="minConv")S.rules.maxConv=nv;else S.rules.minConv=nv;}
      if(S.rules.minJugar+S.rules.minDescanso>5){if(v==="minJugar")S.rules.minDescanso=5-nv;else S.rules.minJugar=5-nv;}
      break;
    case"rulereset":S.rules=Object.assign({},RULES);toast("Valores restablecidos");break;
    case"exportar":exportar();return;
    case"asksalir":ui.confirm="out";rerenderKeepScroll();return;
    case"salir":if(A.logout)A.logout();return;
    default:return;
  }
  save();
  if(keep)rerenderKeepScroll();else{render();window.scrollTo(0,0);}
});

document.addEventListener("input",function(e){
  var t=e.target,m=match(),d=t.dataset;
  if(d.pn){var p=S.roster.filter(function(x){return x.id===d.pn;})[0];var n=parseInt(t.value,10);if(p&&!isNaN(n))p.num=n;save();return;}
  if(d.pp){var q=S.roster.filter(function(x){return x.id===d.pp;})[0];if(q)q.name=t.value;save();return;}
  if(!m)return;
  if(d.k){
    m[d.k]=t.value;
    if(d.k==="llegada")m.llegadaManual=!!t.value;
    if(d.k==="hora"&&!m.llegadaManual){m.llegada=menos45(t.value);var l=document.querySelector('[data-k="llegada"]');if(l)l.value=m.llegada;}
  }else if(d.mot)m.motivos[d.mot]=t.value;
  else if(d.obj)m.obj[d.obj].t=t.value;
  else if(d.ind){if(!m.ind[d.ind])m.ind[d.ind]={t:"",ev:""};m.ind[d.ind].t=t.value;}
  else return;
  save();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.k==="rival"||t.dataset.k==="fecha"||t.dataset.k==="hora"||t.dataset.k==="jornada"){var a=document.activeElement;if(!a||a===document.body||a===t)rerenderHeader();}
  if(t.id==="imp"&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){
      try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.roster)||!Array.isArray(d.matches))throw 0;S=d;S.rules=Object.assign({},RULES,S.rules||{});save();ui.mid=null;render();toast("Copia importada: "+S.matches.length+" partidos");}
      catch(x){toast("El archivo no es una copia válida");}
    };
    r.readAsText(t.files[0]);
  }
});
function rerenderHeader(){var m=match();if(!m)return;var b=document.querySelector(".h-t");if(b)b.innerHTML='<b>'+esc(m.rival?"vs "+m.rival:"Partido nuevo")+'</b><span>'+esc(fechaLarga(m)||"Alevín A · Temporada 2026/27")+'</span>';}
function exportar(){
  try{
    var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
    var d=new Date(),f=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    a.href=u;a.download="partidos-alevin-a-"+f+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);
    toast("Copia exportada");
  }catch(e){toast("No se ha podido exportar en este navegador");}
}

document.addEventListener("submit",function(e){
  if(e.target.id!=="lf")return;e.preventDefault();
  if(!A.login){ui.loginErr="La sincronización no se ha cargado. Recarga la página con conexión.";render();return;}
  var em=$("le").value,pw=$("lp").value;ui.loginBusy=true;ui.loginErr="";render();$("le").value=em;A.login(em,pw);
});
function typing(){var a=document.activeElement;return!!a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"));}
document.addEventListener("focusout",function(){if(pendingRender)setTimeout(function(){if(pendingRender&&!typing())rerenderKeepScroll();},60);});
A.check=check;A.ui=ui;A.render=render;
A.getState=function(){return S;};
A.setAuth=function(st,email){ui.auth=st;ui.user=email||"";ui.loginBusy=false;if(st!=="in"){ui.mid=null;ui.tab="partidos";}render();};
A.loginResult=function(err){ui.loginBusy=false;ui.loginErr=err||"";if(err)render();};
A.setSync=function(code,txt){ui.sync=code;ui.syncTxt=txt;var d=$("dot");if(d){d.className="dot "+code;d.title=txt;d.setAttribute("aria-label",txt);}var t=$("synctxt");if(t)t.textContent=txt;};
A.applyRemote=function(team,matches){
  S.roster=team.roster||[];S.rules=Object.assign({},RULES,team.rules||{});S.seq=team.seq||S.roster.length;S.matches=matches||[];
  store();
  if(ui.mid&&!match()){ui.mid=null;}
  if(typing())pendingRender=true;else rerenderKeepScroll();
};
A.clearLocal=function(){try{localStorage.removeItem(KEY);}catch(e){}S=load();};
render();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
</script>
<script type="module" src="sync.js"></script>
</body>
